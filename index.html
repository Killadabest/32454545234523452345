<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YOU ARE AN IDIOT</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; cursor: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; background: #000; overflow: hidden;
  }
  .idiot {
    position: absolute;
    font-family: "Comic Sans MS", "Arial Black", Impact, sans-serif;
    font-weight: 900;
    color: #ff00ff;
    text-shadow: 3px 3px 0 #000, -3px -3px 0 #0ff, 0 0 12px #f0f;
    white-space: nowrap;
    pointer-events: none;
    will-change: transform, color, left, top;
  }
  #smiley {
    position: fixed; left: 50%; top: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%, -50%);
    z-index: 999999; pointer-events: none;
    animation: spin 0.35s linear infinite;
    filter: drop-shadow(0 0 30px #ff00ff) drop-shadow(0 0 12px #0ff);
  }
  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }
  #smiley2 {
    position: fixed; left: 50%; top: 50%;
    width: 400px; height: 400px;
    transform: translate(-50%, -50%);
    z-index: 999998; pointer-events: none;
    animation: spin 0.2s linear infinite reverse;
    opacity: 0.35;
  }
  #hint {
    position: fixed; bottom: 8px; left: 8px;
    color: #ff0000; font-family: monospace; font-size: 14px;
    z-index: 1000000; pointer-events: none;
    animation: blink 0.3s steps(2) infinite;
    text-shadow: 0 0 8px #f00;
  }
  @keyframes blink { 50% { opacity: 0; } }
  #flash {
    position: fixed; inset: 0; background: #fff;
    z-index: 999997; pointer-events: none;
    mix-blend-mode: difference; opacity: 0.08;
    animation: flash 0.1s steps(2) infinite;
  }
  @keyframes flash { 50% { opacity: 0.22; } }
  #cursorTrap {
    position: fixed; inset: 0; z-index: 999996; cursor: none;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cursorTrap"></div>
<div id="flash"></div>

<svg id="smiley2" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="90" fill="none" stroke="#0ff" stroke-width="8"/>
  <circle cx="70" cy="80" r="12" fill="#0ff"/>
  <circle cx="130" cy="80" r="12" fill="#0ff"/>
  <path d="M 55 125 Q 100 175 145 125" stroke="#0ff" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>

<svg id="smiley" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <circle cx="100" cy="100" r="90" fill="#ffdd00" stroke="#000" stroke-width="6"/>
  <circle cx="70" cy="80" r="12" fill="#000"/>
  <circle cx="130" cy="80" r="12" fill="#000"/>
  <path d="M 55 125 Q 100 175 145 125" stroke="#000" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>

<div id="hint">▶ CLICK TO CONTINUE ◀</div>

<script>
(function () {
  var stage = document.getElementById("stage");
  var hint  = document.getElementById("hint");

  var PHRASES = [
    "YOU ARE AN IDIOT", "YOU ARE AN IDIOT!", "HAHAHAHAHAHA",
    "LOLOLOLOLOL", "YOU ARE AN IDIOT!!!", "SMILE :)",
    "GET REKT", "YOU ARE AN IDIOT", "NICE TRY", "TOO SLOW",
    "YOU ARE AN IDIOT", "SYSTEM COMPROMISED", "UR MOM",
    "YOU ARE AN IDIOT", "gg ez", "XDDDDDDDD"
  ];
  var COLORS = ["#ff00ff","#00ffff","#ffff00","#ff0000","#00ff00","#ff8800","#ffffff","#ff0088","#00ffcc"];

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

  // ============================================================
  // AUDIO — maximum loudness a webpage can produce.
  // ============================================================
  var audioCtx = null;
  var soundOn  = false;

  function startSound() {
    if (soundOn) return;
    soundOn = true;
    hint.style.display = "none";

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return; }
    if (audioCtx.state === "suspended") audioCtx.resume();

    // --- Master chain: compressor -> gain(1.0) -> destination ---
    // Compressor keeps everything pinned at ceiling without digital clipping.
    var comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -10;
    comp.knee.value      = 0;
    comp.ratio.value     = 20;
    comp.attack.value    = 0.002;
    comp.release.value   = 0.05;

    var master = audioCtx.createGain();
    master.gain.value = 1.0;   // MAX
    comp.connect(master);
    master.connect(audioCtx.destination);

    // --- Oscillator bank: many shrill tones stacked ---
    // Each one slightly detuned -> beating + density = perceived louder.
    var freqs = [2800, 3200, 3600, 4100, 4600, 5200, 5800];
    var types = ["square","sawtooth","square","sawtooth","square","sawtooth","square"];
    var oscs  = [];

    freqs.forEach(function (f, i) {
      var o = audioCtx.createOscillator();
      o.type = types[i];
      o.frequency.value = f + (Math.random()*40 - 20);
      var g = audioCtx.createGain();
      g.gain.value = 0.15;         // each of 7 stacked; compressor handles the sum
      o.connect(g);
      g.connect(comp);
      o.start();
      oscs.push(o);
    });

    // --- LFO warbling ALL oscillators for that classic virus wobble ---
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 7;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 500;
    lfo.connect(lfoGain);
    oscs.forEach(function (o) { lfoGain.connect(o.frequency); });
    lfo.start();

    // --- Second LFO: amplitude throb, on top of pitch wobble ---
    var trem = audioCtx.createOscillator();
    trem.type = "square";
    trem.frequency.value = 12;
    var tremGain = audioCtx.createGain();
    tremGain.gain.value = 0.4;
    var tremDepth = audioCtx.createGain();
    tremDepth.gain.value = 0.6;
    trem.connect(tremGain);
    tremGain.connect(tremDepth.gain);
    tremDepth.connect(master.gain);
    trem.start();

    // --- Noise layer: white noise adds a hiss/scream component ---
    var bufSize = audioCtx.sampleRate * 2;
    var buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
    var noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    var nf = audioCtx.createBiquadFilter();
    nf.type = "bandpass";
    nf.frequency.value = 4000;
    nf.Q.value = 0.6;
    var ng = audioCtx.createGain();
    ng.gain.value = 0.12;
    noise.connect(nf); nf.connect(ng); ng.connect(comp);
    noise.start();

    // --- Random error "dings" layered on top forever ---
    setInterval(function () {
      var t = audioCtx.currentTime;
      var o1 = audioCtx.createOscillator();
      var o2 = audioCtx.createOscillator();
      var g  = audioCtx.createGain();
      o1.type = "square"; o2.type = "square";
      o1.frequency.value = 1200 + Math.random()*600;
      o2.frequency.value = 1500 + Math.random()*600;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
      o1.connect(g); o2.connect(g); g.connect(comp);
      o1.start(t); o2.start(t);
      o1.stop(t + 0.18); o2.stop(t + 0.18);
    }, 260);
  }

  ["mousedown","keydown","touchstart","pointerdown"].forEach(function (ev) {
    window.addEventListener(ev, startSound, { once: true });
  });

  // ============================================================
  // TEXT FLOOD — saturate the DOM
  // ============================================================
  function spawnText() {
    var el = document.createElement("div");
    el.className = "idiot";
    el.style.fontSize = Math.floor(rand(20, 90)) + "px";
    el.style.color    = pick(COLORS);
    el.textContent    = pick(PHRASES);
    el.style.left     = Math.floor(rand(-60, window.innerWidth  - 40)) + "px";
    el.style.top      = Math.floor(rand(-30, window.innerHeight - 30)) + "px";
    el.style.transform = "rotate(" + Math.floor(rand(-30,30)) + "deg) scale(" + rand(0.7,1.4).toFixed(2) + ")";
    stage.appendChild(el);
    while (stage.children.length > 500) stage.removeChild(stage.firstChild);
  }

  function loop() {
    for (var i = 0; i < 8; i++) spawnText();
    requestAnimationFrame(loop);
  }
  loop();

  setInterval(function () { for (var i = 0; i < 30; i++) spawnText(); }, 16);

  // BG strobe
  var hue = 0;
  setInterval(function () {
    hue = (hue + 53) % 360;
    stage.style.background = "hsl(" + hue + ", 100%, 6%)";
  }, 60);

  // Emoji / character storm
  var STORM = ["😈","💀","☠️","👹","🤡","💩","🖕","⚡","🔥","❗","⁉️","🚨","⛔","☣️","☢️","🤖","👾","💣"];
  setInterval(function () {
    for (var i = 0; i < 5; i++) {
      var e = document.createElement("div");
      e.className = "idiot";
      e.style.fontSize = Math.floor(rand(24, 80)) + "px";
      e.style.left = Math.floor(rand(0, window.innerWidth)) + "px";
      e.style.top  = Math.floor(rand(0, window.innerHeight)) + "px";
      e.textContent = pick(STORM);
      e.style.transform = "rotate(" + Math.floor(rand(-45,45)) + "deg)";
      stage.appendChild(e);
      while (stage.children.length > 500) stage.removeChild(stage.firstChild);
    }
  }, 60);

  // Window title spam (visible in tab)
  var TITLES = ["YOU ARE AN IDIOT","☠ ERROR ☠","HAHAHAHA","SYSTEM FAILURE","XDDDDD","VIRUS.EXE"];
  setInterval(function () {
    document.title = pick(TITLES) + " ".repeat(Math.floor(Math.random()*20));
  }, 80);

  // Trap: right-click and selection disabled
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("selectstart", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart",   function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
